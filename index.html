<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f6f3a" />
    <title>חאגאי</title>
    <script type="module" crossorigin src="/assets/index-3x7MaB8g.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B281GoiM.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button id="mute-btn" class="icon-btn" type="button" aria-label="השתקה" aria-pressed="false">
          🔊
        </button>
        <button id="reset-btn" class="text-btn" type="button">איפוס</button>
      </header>

      <section class="meter" aria-label="מד שמות שגויים">
        <div class="meter-counts">
          <span class="count">
            <span class="chip chip-yellow" aria-hidden="true"></span>
            <span id="yellow-count" class="count-num">0</span>
            <span class="count-label">צהובים</span>
          </span>
          <span class="count">
            <span class="chip chip-red" aria-hidden="true"></span>
            <span id="red-count" class="count-num">0</span>
            <span class="count-label">אדומים</span>
          </span>
        </div>
        <div class="rank">
          <span class="rank-label">דרגה:</span>
          <span id="rank-text" class="rank-text">עבירה קלה</span>
        </div>
      </section>

      <main id="stage" class="stage">
        <button id="main-btn" class="main-btn" type="button">
          <span id="main-label" class="main-label">חאגאי</span>
          <span id="out-msg" class="out-msg" aria-hidden="true">אתה בחוץ!</span>
        </button>
        <button id="hagy-btn" class="hagy-btn" type="button" hidden>
          <span class="hagy-name">חגי</span>
          <span class="hagy-hint">תגיד את השם נכון כדי לחזור למשחק</span>
        </button>
      </main>

      <footer class="bottombar">
        <button id="share-btn" class="share-btn" type="button">שתפו את התוצאה</button>
      </footer>
    </div>
  </body>
</html>
